# Роль платформенного администратора
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: platform-admin
rules:
- apiGroups: ["*"]
  resources: ["*"]
  verbs: ["*"]

---

# Роль разработчиков tenant-сервисов
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tenant-services-dev
rules:
- apiGroups: ["", "apps"]
  resources: ["pods", "services", "deployments", "replicasets", "configmaps"]
  verbs: ["create", "update", "delete", "get", "list", "watch"]

---

# Роль просмотр сервисов
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tenant-services-viewer
rules:
- apiGroups: ["", "apps"]
  resources: ["deployments", "pods", "services", "configmaps"]
  verbs: ["get", "list", "watch"]

---

# Роль аудитора безопасности
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: security-auditor
rules:
- apiGroups: [""]
  resources: ["secrets", "configmaps", "pods", "services"]
  verbs: ["get", "list", "watch"]