# Admin доступ для Alice
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: platform-admin-binding
subjects:
- kind: ServiceAccount
  name: alice
  namespace: kube-system
roleRef:
  kind: ClusterRole
  name: platform-admin
  apiGroup: rbac.authorization.k8s.io

---

# Разработчик tenant-сервисов для Alice
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tenant-services-dev-binding
subjects:
- kind: ServiceAccount
  name: alice
  namespace: tenant-services
roleRef:
  kind: ClusterRole
  name: tenant-services-dev
  apiGroup: rbac.authorization.k8s.io

---

# Просмотр tenant-сервисов для Carol
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tenant-services-viewer-binding
subjects:
- kind: ServiceAccount
  name: carol
  namespace: tenant-services
roleRef:
  kind: ClusterRole
  name: tenant-services-viewer
  apiGroup: rbac.authorization.k8s.io

---

# Аудитор безопасности Dave
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: security-auditor-binding
subjects:
- kind: ServiceAccount
  name: dave
  namespace: kube-system
roleRef:
  kind: ClusterRole
  name: security-auditor
  apiGroup: rbac.authorization.k8s.io